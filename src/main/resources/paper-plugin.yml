name: FaunaReborn
description: '${description}'
version: '${version}'

main: io.github.devskycore.faunareborn.core.FaunaRebornPlugin
api-version: '1.21'
folia-supported: true
load: POSTWORLD

authors: [ DevSkyCore ]
website: https://github.com/devskycore

permissions:
  faunareborn.command.reload:
    description: Allows using /fauna reload.
    default: op
  faunareborn.reload:
    description: Legacy reload permission alias.
    default: op
  faunareborn.admin:
    description: Admin permission alias for reload and management.
    default: op
  faunareborn.command.gui:
    description: Allows using /fauna gui.
    default: op
