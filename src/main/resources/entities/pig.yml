# =============================================================================
# Quick Guide (Entities)
# =============================================================================
# - Use true/false for booleans.
# - Use decimals for multipliers, cooldowns, and distances.
# - Keep 2-space indentation under each parent key.
# - Keep key names exactly as provided by the plugin.
# - Tuning tip: values ending in "-multiplier" scale behavior intensity.

# =============================================================================
# Pig Module
# =============================================================================
pig:
  enabled: true

# =============================================================================
# Pig Hostility
# =============================================================================
pig-hostility:
  # Coordinates nearby pigs to react together.
  social-alert:
    enabled: true
    radius: 14.0
    cooldown-seconds: 0.76
    join-cooldown-seconds: 2.0
    responders:
      adults-only: true
    max-responders: 3
    triggers:
      by-damage-to-pig: true
      by-nearby-pig-death: true

# =============================================================================
# Rod Provocation
# =============================================================================
pig-rod-provocation:
  enabled: true
  aggression-duration-seconds: 6.0
  rod-trigger-cooldown-seconds: 2.0
  detection-range: 12.0
  warning:
    duration-seconds: 0.25
  attack:
    damage: 2.5
    cooldown: 1.2
    knockback-strength: 1.1
  movement:
    speed-multiplier: 1.25
  targeting:
    forget-target-after-seconds: 8.0
    require-line-of-sight: true
    retarget-grace-seconds: 3.0
  charge:
    enabled: true
    min-interval-seconds: 0.8
    max-interval-seconds: 2.5
    extra-push: 0.17
  sounds:
    aggressive-enabled: true
    warning-enabled: true
    stomp-enabled: true

# =============================================================================
# Resource Provocation
# =============================================================================
pig-resource-provocation:
  enabled: true
  thresholds:
    carrot: 8
    apple: 6
    raw-porkchop: 4
  time-window-seconds: 12.0
  max-item-age-ticks: 2400
  night-modifier:
    enabled: true
    threshold-multiplier: 0.75
  social-propagation-enabled: true
  max-responders: 3
  detection-radius: 8.0
  trigger-cooldown-seconds: 2.5
  aggression-duration-seconds: 10.0

# =============================================================================
# Environment Modifiers
# =============================================================================
environment-modifiers:
  enabled: true
  debug: false
  cache:
    refresh-interval-seconds: 5
  rain:
    enabled: true
    aggression-multiplier: 1.10
    detection-radius-multiplier: 1.08
    attack-damage-multiplier: 1.05
    movement-speed-multiplier: 1.04
    social-alert-multiplier: 1.08
    pickup-requirement-multiplier: 0.90
  thunderstorm:
    enabled: true
    aggression-multiplier: 1.24
    detection-radius-multiplier: 1.18
    attack-damage-multiplier: 1.10
    movement-speed-multiplier: 1.10
    attack-cooldown-multiplier: 0.90
    social-alert-multiplier: 1.22
    target-persistence-multiplier: 1.22
    pickup-requirement-multiplier: 0.76
  full-moon:
    enabled: true
    aggression-multiplier: 1.30
    detection-radius-bonus: 1.25
    attack-damage-multiplier: 1.10
    movement-speed-multiplier: 1.07
    social-alert-multiplier: 1.20
    target-persistence-multiplier: 1.20
    pickup-requirement-multiplier: 0.80
  combinations:
    night-rain:
      enabled: true
      aggression-multiplier: 1.12
    night-thunderstorm:
      enabled: true
      aggression-multiplier: 1.32
      detection-radius-multiplier: 1.20
      attack-cooldown-multiplier: 0.86
    night-full-moon:
      enabled: true
      aggression-multiplier: 1.35
      social-alert-multiplier: 1.25
