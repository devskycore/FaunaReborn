# =============================================================================
# Quick Guide (Entities)
# =============================================================================
# - Use true/false for booleans.
# - Use decimals for multipliers, cooldowns, and distances.
# - Keep 2-space indentation under each parent key.
# - Keep key names exactly as provided by the plugin.
# - Tuning tip: values ending in "-multiplier" scale behavior intensity.

# =============================================================================
# Cow Module
# =============================================================================
cow:
  # Scaffold module for upcoming cow behavior.
  enabled: true

# =============================================================================
# Cow Hostility
# =============================================================================
cow-hostility:
  # Coordinates nearby cows to react together.
  social-alert:
    enabled: true
    radius: 14.0
    cooldown-seconds: 0.76
    join-cooldown-seconds: 2.0
    responders:
      adults-only: true
    max-responders: 3
    triggers:
      by-damage-to-cow: true
      by-nearby-cow-death: true

# =============================================================================
# Milk Provocation
# =============================================================================
cow-milk-provocation:
  enabled: true

  # How long the cow remains aggressive after being milked.
  aggression-duration-seconds: 6.0
  # Cooldown per player-cow pair to prevent trigger spam.
  milking-trigger-cooldown-seconds: 2.0

  # Maximum distance the cow keeps tracking its target.
  detection-range: 12.0

  warning:
    # Brief warning phase (stare + sound) before full chase.
    duration-seconds: 0.25

  attack:
    damage: 2.0
    cooldown: 1.2
    knockback-strength: 1.1

  movement:
    speed-multiplier: 1.25

  targeting:
    forget-target-after-seconds: 8.0
    require-line-of-sight: true
    retarget-grace-seconds: 3.0

  charge:
    enabled: true
    min-interval-seconds: 0.8
    max-interval-seconds: 2.5
    extra-push: 0.17

  sounds:
    aggressive-enabled: true
    warning-enabled: true
    stomp-enabled: true

# =============================================================================
# Resource Provocation
# =============================================================================
cow-resource-provocation:
  enabled: true
  thresholds:
    leather: 8
    raw-beef: 6
    bone: 4
  # Items picked in this time-window accumulate per item type before triggering.
  time-window-seconds: 12.0
  # Ignore old dropped items to avoid stale territorial reactions.
  max-item-age-ticks: 2400
  night-modifier:
    enabled: true
    threshold-multiplier: 0.75
  social-propagation-enabled: true
  # Hard cap for direct cows recruited by one resource pickup trigger.
  max-responders: 3
  # Radius used to locate nearby cows that can detect the resource carrier.
  detection-radius: 8.0
  # Cooldown per player-cow pair to prevent constant retrigger loops.
  trigger-cooldown-seconds: 2.5
  # Threat duration applied when resource provocation triggers.
  aggression-duration-seconds: 10.0

# =============================================================================
# Environment Modifiers
# =============================================================================
environment-modifiers:
  enabled: true
  debug: false
  cache:
    refresh-interval-seconds: 5
  rain:
    enabled: true
    aggression-multiplier: 1.10
    detection-radius-multiplier: 1.08
    attack-damage-multiplier: 1.05
    movement-speed-multiplier: 1.04
    social-alert-multiplier: 1.08
    pickup-requirement-multiplier: 0.90
  thunderstorm:
    enabled: true
    aggression-multiplier: 1.22
    detection-radius-multiplier: 1.16
    attack-damage-multiplier: 1.10
    movement-speed-multiplier: 1.08
    attack-cooldown-multiplier: 0.92
    social-alert-multiplier: 1.20
    target-persistence-multiplier: 1.20
    pickup-requirement-multiplier: 0.78
  full-moon:
    enabled: true
    aggression-multiplier: 1.28
    detection-radius-bonus: 1.25
    attack-damage-multiplier: 1.08
    movement-speed-multiplier: 1.06
    social-alert-multiplier: 1.18
    target-persistence-multiplier: 1.18
    pickup-requirement-multiplier: 0.82
  combinations:
    night-rain:
      enabled: true
      aggression-multiplier: 1.10
    night-thunderstorm:
      enabled: true
      aggression-multiplier: 1.28
      detection-radius-multiplier: 1.18
      attack-cooldown-multiplier: 0.88
    night-full-moon:
      enabled: true
      aggression-multiplier: 1.32
      social-alert-multiplier: 1.24
