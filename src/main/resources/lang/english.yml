  common:
    died: " died "
    dot: "."
  species:
    pig:
      singular: "PIG"
      plural: "PIGS"
    cow:
      singular: "COW"
      plural: "COWS"
    chicken:
      singular: "CHICKEN"
      plural: "CHICKENS"
  cause:
    rod:
      prefix: "after "
      hook-action: "hooking"
      middle: " the wrong "
    milking:
      prefix: "after "
      action: "milking"
      middle: " the wrong "
    territorial:
      prefix: "after "
      action: "trespassing"
      middle: " into "
      suffix: " territory."
    cooking:
      prefix: "by "
      action: "angering"
      furnace-suffix: " with a furnace."
      smoker-suffix: " with a smoker."
      campfire-suffix: " with a campfire."
    herd-damage:
      prefix: "after "
      action: "striking"
      middle: " the wrong herd of "
    herd-nearby:
      prefix: "while trying to escape "
      action: "enraged"
    baby:
      prefix: "after "
      action: "threatening"
      middle: " a baby "
  direct:
    pig:
      prefix: "after being "
      action: "mauled"
      middle: " by a hostile "
