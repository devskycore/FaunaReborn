    unknown-subcommand: "Unknown subcommand. Use /fauna help."
    did-you-mean: "Maybe you meant /fauna {command}?"
    possible-subcommands: "These subcommands look close: {commands}"
    try-help: "Try: "
    state:
      enabled: "enabled"
      disabled: "disabled"
      enabled-title: "Enabled"
      disabled-title: "Disabled"
  meta:
    help:
      usage: "/fauna help [page|admin|permissions|query]"
      description: "Browse help pages or search commands."
    version:
      usage: "/fauna version"
      description: "Show version details."
    about:
      usage: "/fauna about"
      description: "Plugin overview."
    entities:
      usage: "/fauna entities"
      description: "Entities overview."
    reload:
      usage: "/fauna reload"
      description: "Update config and modules."
    gui:
      usage: "/fauna gui"
      description: "Open the admin panel."
    lang:
      usage: "/fauna lang [language]"
      description: "Open selector or change language."
