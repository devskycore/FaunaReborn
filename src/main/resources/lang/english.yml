    name-label: "Name"
    version-label: "Version"
    authors-label: "Authors"
    minecraft-label: "Minecraft"
    server-label: "Server"
    status-label: "Status"
    status-running: "Running"
  reload:
    already-in-progress: "reload already in progress."
    started: "reload started..."
    completed: "Reload completed in {elapsedMillis} ms."
    label: "Reload"
    complete-word: "complete"
    in-word: "in"
    failed: "Reload failed. Previous config is still active."
  lang:
    usage: "Usage: /fauna lang [language]"
    # Keep placeholders like {languages} unchanged.
    available: "Available languages: {languages}"
