# =============================================================================
# Quick Guide (Lang)
# =============================================================================
# - Keep placeholders like {language}, {totalPages}, {elapsedMillis} unchanged.
# - Keep commands and slash syntax unchanged (example: /fauna help [page]).
# - Keep 2-space indentation under each parent key.
# - Keep key names exactly as provided by the plugin.
# - Translate only values inside quotes.

# =============================================================================
# Commands
# =============================================================================
commands:
  common:
    # Keep this short for chat and GUI readability.
    prefix: "FaunaReborn"
    no-permission: "You do not have permission to use this command."
    player-only: "This command can only be executed by a player."
    unknown-subcommand: "Unknown subcommand. Use /fauna help."
    state:
      enabled: "enabled"
      disabled: "disabled"
      enabled-title: "Enabled"
      disabled-title: "Disabled"
  meta:
    help:
      usage: "/fauna help [page]"
      description: "Show available commands."
    version:
      usage: "/fauna version"
      description: "Show plugin and runtime version details."
    about:
      usage: "/fauna about"
      description: "Learn what FaunaReborn does."
    entities:
      usage: "/fauna entities"
      description: "List supported entities and current state."
    reload:
      usage: "/fauna reload"
      description: "Reload configuration and modules."
    gui:
      usage: "/fauna gui"
      description: "Open the FaunaReborn admin GUI."
    lang:
      usage: "/fauna lang <language>"
      description: "Change active plugin language."
  help:
    none-available: "No commands are available to you."
    usage: "Usage: /fauna help [page]"
    page-out-of-range: "Page out of range. Available pages: 1-{totalPages}."
    header: "Commands ({page}/{totalPages})"
    next-page-tip: "Hint: /fauna help {nextPage}"
  about:
    title: "FaunaReborn"
    tagline: "Nature fights back."
    line1: "Turns passive animals into intelligent, configurable threats."
    line2: "Includes per-entity settings, runtime controls, optimized processing, and advanced behavior systems."
  entities:
    header: "Supported Entities"
  version:
    header: "FaunaReborn Version"
    unknown-author: "Unknown"
    name-label: "Name"
    version-label: "Version"
    authors-label: "Authors"
    minecraft-label: "Minecraft"
    server-label: "Server"
    status-label: "Status"
    status-running: "Running"
  reload:
    already-in-progress: "FaunaReborn reload is already in progress."
    started: "FaunaReborn reload started..."
    completed: "FaunaReborn reload completed in {elapsedMillis} ms."
    failed: "FaunaReborn reload failed. Previous configuration is still active."
  lang:
    usage: "Usage: /fauna lang <language>"
    # Keep placeholders like {languages} unchanged.
    available: "Available languages: {languages}"
    invalid: "Language '{language}' not found. Available: {languages}"
    # Keep placeholders like {language} unchanged.
    changed: "Language changed to {language}."

