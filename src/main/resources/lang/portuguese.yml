# =============================================================================
# Quick Guide (Lang)
# =============================================================================
# - Keep placeholders like {language}, {totalPages}, {elapsedMillis} unchanged.
# - Keep commands and slash syntax unchanged (example: /fauna help [página]).
# - Keep 2-space indentation under each parent key.
# - Keep key names exactly as provided by the plugin.
# - Translate only values inside quotes.

# =============================================================================
# Commands
# =============================================================================
commands:
  common:
    # Keep this short for chat and GUI readability.
    prefix: "FaunaReborn"
    no-permission: "Você não tem permissão para usar este comando."
    player-only: "Este comando só pode ser executado por um jogador."
    unknown-subcommand: "Subcomando desconhecido. Use /fauna help."
    state:
      enabled: "ativado"
      disabled: "desativado"
      enabled-title: "Ativado"
      disabled-title: "Desativado"
  meta:
    help:
      usage: "/fauna help [página]"
      description: "Mostra os comandos disponíveis."
    version:
      usage: "/fauna version"
      description: "Mostra detalhes da versão do plugin e do runtime."
    about:
      usage: "/fauna about"
      description: "Explica o que o FaunaReborn faz."
    entities:
      usage: "/fauna entities"
      description: "Lista entidades suportadas e o estado atual."
    reload:
      usage: "/fauna reload"
      description: "Recarrega configurações e módulos."
    gui:
      usage: "/fauna gui"
      description: "Abre a GUI administrativa do FaunaReborn."
    lang:
      usage: "/fauna lang <idioma>"
      description: "Altera o idioma ativo do plugin."
  help:
    none-available: "Não há comandos disponíveis para você."
    usage: "Uso: /fauna help [página]"
