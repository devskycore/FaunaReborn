# - Mantieni invariati i comandi e la sintassi slash (esempio: /fauna help [pagina|admin|permissions|query]).
# - Mantieni 2 spazi di indentazione sotto ogni chiave padre.
# - Mantieni i nomi delle chiavi esattamente come forniti dal plugin.
# - Traduci solo i valori tra virgolette.

