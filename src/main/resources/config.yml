# =============================================================================
# Quick Guide
# =============================================================================
# - Use true/false for booleans.
# - Use decimals for numeric multipliers and distances (e.g., 1.0, 14.0).
# - Use [] for lists (example: worlds: [world, world_nether]).
# - Use {} for key/value maps (example: world-multipliers: {world_nether: 1.15}).
# - Keep 2-space indentation under each parent key.
# - Keep section names and key names exactly as provided.

# =============================================================================
# Core
# =============================================================================
config-version: 2
global-enabled: true

# =============================================================================
# Language
# =============================================================================
language:
  # Locale token loaded from plugins/FaunaReborn/lang/.
  # Built-in files: english.yml (en), spanish.yml (es), portuguese.yml (pt), italian.yml (it), french.yml (fr).
  # Accepted examples: en, es, pt-br, english, espanol, portugues, italiano, francais.
  # Custom locale files are supported by filename base (example: german.yml -> "german").
  file: en

# =============================================================================
# Update Checker (GitHub Releases)
# ======================================c=======================================
update-checker:
  enabled: true

# =============================================================================
# Project Links
# =============================================================================
links:
  github: "https://github.com/devskycore/FaunaReborn"
  spigot: "https://www.spigotmc.org/resources/faunareborn-nature-fights-back.135257/"
  hangar: "https://hangar.papermc.io/DevSkyCore/FaunaReborn"
  modrinth: "https://modrinth.com/plugin/faunareborn"
  discord: "https://discord.gg/GvbxzTz88x"

# =============================================================================
# World Filter
# =============================================================================
# Global world filter for hostility modules.
# ALL: enabled in every world.
# WHITELIST: enabled only in listed worlds.
# BLACKLIST: enabled in every world except listed worlds.
world-filter:
  mode: ALL # Accepted values: ALL | WHITELIST | BLACKLIST.
  # Worlds used by WHITELIST/BLACKLIST mode.
  worlds: []

# =============================================================================
# Level of Detail (LOD)
# =============================================================================
lod:
  enabled: true
  # Prevents rapid tier switching near distance boundaries.
  hysteresis-distance: 3.0
  distances:
    # Distance from nearest player (in blocks) used for tiering.
    high: 14.0
    medium: 28.0
    low: 44.0
  interval-ticks:
    high: 1
    medium: 2
    low: 5
    off: 10

# =============================================================================
# Targeting
# =============================================================================
targeting:
  ignore:
    adventure: true
    invisible-potion: true
    vanished: true
    god-mode: true
  scoring:
    enabled: true
    # Higher value prioritizes lower-health targets more strongly.
    health-weight: 1.25
    # Higher value prioritizes closer targets more strongly.
    distance-weight: 1.0
    # Higher value prioritizes targets with current threat.
    current-threat-weight: 0.75
    # Bonus applied when line of sight is clear.
    line-of-sight-bonus: 0.35
    retarget-cooldown-seconds: 2.5
    require-multiple-candidates: true

# =============================================================================
# Damage Scaling
# =============================================================================
damage-scaling:
  difficulty-multipliers:
    peaceful: 0.0
    easy: 0.95
    normal: 1.0
    hard: 1.15
  # Extra per-world multipliers (world name -> multiplier).
  # Example:
  # world_nether: 1.15
  world-multipliers: {}

# =============================================================================
# Activation
# =============================================================================
activation:
  chance: 1.0 # Activation chance from 0.0 to 1.0 (1.0 = 100%).
  # If true, only animals from the normal world lifecycle can become hostile.
  # Counts as natural lifecycle: normal world spawns, breeding, and egg-hatched animals.
  # Excluded: mob spawners and spawn eggs.
  # Legacy alias: activation.only-natural is still supported for existing configs.
  natural-spawns-only: true
  ignore-named: true
  # After a chicken grows from baby to adult, it remains eligible for hostility
  # for this many seconds even without a baby nearby.
  adult-without-baby-grace-seconds: 1200.0

# =============================================================================
# Performance Caps
# =============================================================================
# Hard caps for active hostile entities (non-IDLE) to protect performance.
max-active-hostile-chickens-per-chunk: 8
max-active-hostile-chickens-per-world: 200
# Hard global cap of hostile entities processed per tick to prevent spikes.
max-processed-chickens-per-tick: 240

# =============================================================================
# Night Behavior
# =============================================================================
night-behavior:
  enabled: true
  damage:
    enabled: true
    multiplier: 1.2

# =============================================================================
# Visual Effects
# =============================================================================
visual-effects:
  glow:
    enabled: true
  particles:
    enabled: true
    interval-ticks: 8
    # Relative particle amount/intensity multiplier.
    intensity: 1.0
  sound:
    enabled: true
    interval-ticks: 160
    volume: 0.18
