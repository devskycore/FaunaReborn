config-version: 1
global-enabled: true

# Global world filter for entity hostility modules.
# ALL: enabled in every world.
# WHITELIST: enabled only in listed worlds.
# BLACKLIST: enabled in every world except listed worlds.
world-filter:
  mode: ALL # ALL | WHITELIST | BLACKLIST
  worlds: []

damage-scaling:
  difficulty-multipliers:
    peaceful: 0.0
    easy: 0.95
    normal: 1.0
    hard: 1.15
  # Per-world extra multipliers (world name -> multiplier).
  # Example:
  # world_nether: 1.15
  world-multipliers: {}

activation:
  chance: 1.0 # 1.0 = 100%
  only-natural-chickens: true
  ignore-named: true

# Hard caps for active hostile entities (non-IDLE) to protect server performance.
max-active-hostile-chickens-per-chunk: 8
max-active-hostile-chickens-per-world: 200
# Hard cap of hostile entities processed each tick (global) to prevent lag spikes.
max-processed-chickens-per-tick: 240

night-behavior:
  enabled: true
  damage:
    enabled: true
    multiplier: 1.2

visual-effects:
  glow:
    enabled: true
  particles:
    enabled: true
    interval-ticks: 8
    # Relative particle amount/intensity.
    intensity: 1.0
  sound:
    enabled: true
    interval-ticks: 160
    volume: 0.18
