config-version: 1
global-enabled: true

# Global world filter for entity hostility modules.
# ALL: enabled in every world.
# WHITELIST: enabled only in listed worlds.
# BLACKLIST: enabled in every world except listed worlds.
world-filter:
  mode: ALL # ALL | WHITELIST | BLACKLIST
  worlds: []

lod:
  enabled: true
  # Prevents rapid tier thrashing near boundaries.
  hysteresis-distance: 3.0
  distances:
    # Distance from nearest player (blocks) used for tiering.
    high: 14.0
    medium: 28.0
    low: 44.0
  interval-ticks:
    high: 1
    medium: 2
    low: 5
    off: 10

targeting:
  ignore:
    adventure: true
    invisible-potion: true
    vanished: true
    god-mode: true
  scoring:
    enabled: true
    health-weight: 1.25
    distance-weight: 1.0
    current-threat-weight: 0.75
    line-of-sight-bonus: 0.35
    retarget-cooldown-seconds: 2.5
    require-multiple-candidates: true

damage-scaling:
  difficulty-multipliers:
    peaceful: 0.0
    easy: 0.95
    normal: 1.0
    hard: 1.15
  # Per-world extra multipliers (world name -> multiplier).
  # Example:
  # world_nether: 1.15
  world-multipliers: {}

activation:
  chance: 1.0 # 1.0 = 100%
  only-natural: true
  ignore-named: true

# Hard caps for active hostile entities (non-IDLE) to protect server performance.
max-active-hostile-chickens-per-chunk: 8
max-active-hostile-chickens-per-world: 200
# Hard cap of hostile entities processed each tick (global) to prevent lag spikes.
max-processed-chickens-per-tick: 240

night-behavior:
  enabled: true
  damage:
    enabled: true
    multiplier: 1.2

visual-effects:
  glow:
    enabled: true
  particles:
    enabled: true
    interval-ticks: 8
    # Relative particle amount/intensity.
    intensity: 1.0
  sound:
    enabled: true
    interval-ticks: 160
    volume: 0.18
